<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DQM Agent · From Accelerator to Verdict</title>
<meta name="description" content="One continuous walkthrough: a 3D particle accelerator collides two beams, and the recorded event flows into the DQM Agent's chunked analysis and verdict." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#050810; --cyan:#39d9ff; --violet:#a66cff; --amber:#ffcb45; --text:#eef5ff; --muted:#8291a8; --line:#1b2940; }
  * { box-sizing:border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
  button { font:inherit; }

  .shell { position:fixed; inset:0; overflow:hidden; background:var(--bg); }

  /* Two full-bleed acts stacked vertically; the shell slides between them. */
  .act { position:absolute; inset:0; transition:transform .9s cubic-bezier(.66,0,.28,1); will-change:transform; }
  #actAccel { transform:translateY(0); z-index:2; }
  #actAgent { transform:translateY(100%); z-index:1; }
  .shell.at-agent #actAccel { transform:translateY(-100%); }
  .shell.at-agent #actAgent { transform:translateY(0); z-index:3; }
  .act iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:var(--bg); }

  /* ---------- bottom console on the accelerator act ---------- */
  /* Anchored bottom-left, over the accelerator's lesson column: its own
     floating UI (.hint, .flight-hud, .legend) all lives inside the 3D pane on
     the right, so this corner is the one spot that never collides. */
  .console { position:absolute; left:16px; bottom:18px; z-index:30; display:flex; flex-direction:column; align-items:stretch; gap:11px; width:min(430px,calc(100vw - 32px)); padding:12px 15px; border:1px solid #26405c; border-radius:14px; background:#060d18f2; backdrop-filter:blur(12px); box-shadow:0 16px 40px #000b; }
  .console-actions { display:flex; align-items:center; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  .console.pulse { animation:consolePulse 2.4s ease-in-out infinite; }
  @keyframes consolePulse { 0%,100% { box-shadow:0 16px 40px #000b, 0 0 0 #39d9ff00; } 50% { box-shadow:0 16px 40px #000b, 0 0 26px #39d9ff33; } }
  .console-copy { min-width:0; line-height:1.5; }
  .console-copy small { display:block; margin-bottom:3px; color:#6f9fc0; font:500 8.5px 'DM Mono',monospace; letter-spacing:.13em; text-transform:uppercase; }
  .console-copy span { font-size:12.5px; font-weight:600; color:#eaf4ff; }
  .console-copy b { color:var(--cyan); font-weight:600; }
  .btn { display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border:1px solid #2e4468; border-radius:9px; background:#0d1626; color:var(--text); font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; transition:.16s; }
  .btn:hover { border-color:var(--cyan); color:var(--cyan); }
  .btn.primary { border-color:#2e7491; background:linear-gradient(135deg,#12455e,#132038); color:#dff6ff; }
  .btn.primary:hover { border-color:var(--cyan); box-shadow:0 0 20px #39d9ff2e; }
  .btn.ghost { border-color:transparent; background:transparent; color:var(--muted); font-weight:500; }
  .btn.ghost:hover { color:var(--text); }
  .btn svg { flex:none; }

  /* Countdown ring on the auto-advance button. */
  .ring-wrap { position:relative; display:grid; place-items:center; width:17px; height:17px; flex:none; }
  .ring-wrap svg { position:absolute; inset:0; transform:rotate(-90deg); }
  .ring-wrap circle { fill:none; stroke-width:2.5; }
  .ring-bg { stroke:#ffffff26; }
  .ring-fg { stroke:var(--cyan); stroke-linecap:round; stroke-dasharray:44; stroke-dashoffset:44; transition:stroke-dashoffset .25s linear; }

  /* ---------- back control on the agent act ---------- */
  /* Below the agent's own 52px topbar, over the empty top-left of its 3D pane
     -- its scene caption sits bottom-left and its action bar spans the bottom
     of the rail, so both of those stay reachable. */
  .back-cta { position:absolute; left:14px; top:64px; z-index:30; display:flex; align-items:center; gap:7px; padding:8px 13px; border:1px solid #2e4468; border-radius:20px; background:#0d1626ee; color:var(--text); font-size:11.5px; font-weight:500; cursor:pointer; backdrop-filter:blur(10px); box-shadow:0 10px 26px #0008; }
  .back-cta:hover { border-color:var(--cyan); color:var(--cyan); }

  /* ---------- handoff flash between the two acts ---------- */
  .flash { position:fixed; inset:0; z-index:70; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 50%, #eaffff 0%, #7fe4ff 26%, #1b6ea8 55%, transparent 78%); }
  .flash.fire { animation:flashOut 1s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes flashOut { 0% { opacity:0; transform:scale(.35); } 16% { opacity:.92; transform:scale(1.05); } 100% { opacity:0; transform:scale(1.5); } }

  /* ---------- boot overlay for the agent act ---------- */
  .booting { position:absolute; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; background:var(--bg); transition:opacity .5s ease; pointer-events:none; }
  .booting.hidden { opacity:0; }
  .booting .spin { width:30px; height:30px; border-radius:50%; border:2px solid #1c2c45; border-top-color:var(--cyan); animation:spin .9s linear infinite; }
  .booting span { color:#7f90a8; font:500 10px 'DM Mono',monospace; letter-spacing:.12em; text-transform:uppercase; }
  @keyframes spin { to { transform:rotate(360deg); } }

  @media (max-width:720px) {
    .console { flex-direction:column; align-items:stretch; gap:9px; bottom:14px; }
    .stepper .step-dot span { display:none; }
  }
</style>
</head>
<body>

<div class="shell" id="shell">

  <section class="act" id="actAccel" aria-label="3D particle accelerator">
    <iframe id="accelFrame" title="Interactive 3D particle accelerator"></iframe>

    <div class="console pulse" id="console">
      <div class="console-copy">
        <small id="consoleKicker">Act 01 · Accelerator</small>
        <span id="consoleText">Launch a proton and ride it to the collision at IP1.</span>
      </div>
      <div class="console-actions">
        <button class="btn ghost" id="btnStay" type="button" style="display:none">Stay here</button>
        <button class="btn ghost" id="btnSkipAll" type="button">Skip to the data</button>
        <button class="btn primary" id="btnMain" type="button">
        <span class="ring-wrap" id="ringWrap" style="display:none">
          <svg viewBox="0 0 17 17"><circle class="ring-bg" cx="8.5" cy="8.5" r="7"/><circle class="ring-fg" id="ringFg" cx="8.5" cy="8.5" r="7"/></svg>
        </span>
        <span id="btnMainLabel">Launch a proton</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </section>

  <section class="act" id="actAgent" aria-label="DQM Agent pipeline">
    <div class="booting" id="booting"><div class="spin"></div><span>Warming up the agent pipeline…</span></div>
    <iframe id="agentFrame" title="DQM Agent: collision to verdict"></iframe>
    <button class="back-cta" id="btnBack" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      Back to the accelerator
    </button>
  </section>

</div>

<div class="flash" id="flash"></div>

  function decode(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }

  const $ = (id) => document.getElementById(id);
  const shell = $('shell');
  const accelFrame = $('accelFrame');
  const agentFrame = $('agentFrame');

  const consoleEl = $('console');
  const consoleKicker = $('consoleKicker');
  const consoleText = $('consoleText');
  const btnMain = $('btnMain');
  const btnMainLabel = $('btnMainLabel');
  const btnStay = $('btnStay');
  const ringWrap = $('ringWrap');
  const ringFg = $('ringFg');

  // ---------------------------------------------------------------- payloads
  accelFrame.srcdoc = decode(ACCEL_B64);

  // The agent act runs its own Three.js scene, so it is mounted a moment after
  // the accelerator rather than alongside it -- by the time anyone reaches the
  // collision (or clicks the stepper) it is fully booted and warm.
  let agentMounted = false;
  function mountAgent() {
    if (agentMounted) return;
    agentMounted = true;
    agentFrame.addEventListener('load', () => {
      setTimeout(() => $('booting').classList.add('hidden'), 260);
    }, { once: true });
    agentFrame.srcdoc = decode(AGENT_B64);
  }
  setTimeout(mountAgent, 2500);

  const toAccel = (msg) => { try { accelFrame.contentWindow.postMessage(msg, '*'); } catch (e) {} };

  // The agent frame may still be booting when a handoff is requested (an early
  // stepper click, or a very fast collision). Messages sent before its bridge
  // announces itself are held and flushed on 'dqm:agent-ready' rather than
  // dropped on the floor.
  let agentReady = false;
  const agentQueue = [];
  function toAgent(msg) {
    if (!agentReady) { mountAgent(); agentQueue.push(msg); return; }
    try { agentFrame.contentWindow.postMessage(msg, '*'); } catch (e) {}
  }

  // ------------------------------------------------------------ console state
  // intro    -> nothing launched yet
  // flight   -> proton is in the ring, collision still ahead
  // collided -> fragments exist; offer (and auto-run) the handoff
  let phase = 'intro';
  let countdownTimer = null;

  function stopCountdown() {
    clearInterval(countdownTimer);
    countdownTimer = null;
    ringWrap.style.display = 'none';
    ringFg.style.strokeDashoffset = 44;
  }

  function setPhase(next) {
    phase = next;
    stopCountdown();
    btnStay.style.display = 'none';
    consoleEl.classList.toggle('pulse', next !== 'flight');
    // Once the collision has happened the primary button already leads into
    // the data, so the shortcut is redundant.
    $('btnSkipAll').style.display = next === 'collided' ? 'none' : 'inline-flex';

    if (next === 'intro') {
      consoleKicker.textContent = 'Act 01 · Accelerator';
      consoleText.innerHTML = 'Launch a proton and ride it to the collision at IP1.';
      btnMainLabel.textContent = 'Launch a proton';
    } else if (next === 'flight') {
      consoleKicker.textContent = 'Act 01 · Beam in flight';
      consoleText.innerHTML = 'Two bunches are accelerating toward each other — collision in a few seconds.';
      btnMainLabel.textContent = 'Skip ahead to the collision';
    } else if (next === 'collided') {
      consoleKicker.textContent = 'Impact at IP1 · event recorded';
      consoleText.innerHTML = 'The detector recorded this event. Follow it into the data, where it stacks up into <b>one chunk among many</b>.';
      btnMainLabel.textContent = 'Follow the tracks into the data';
      btnStay.style.display = 'inline-flex';
      startCountdown(3200);
    }
  }

  function startCountdown(ms) {
    mountAgent();
    ringWrap.style.display = 'grid';
    const started = performance.now();
    countdownTimer = setInterval(() => {
      const p = Math.min(1, (performance.now() - started) / ms);
      ringFg.style.strokeDashoffset = String(44 * (1 - p));
      if (p >= 1) { stopCountdown(); goToAgent(); }
    }, 90);
  }

  // ------------------------------------------------------------- act handoff
  function goToAgent(fromCollision) {
    stopCountdown();
    mountAgent();
    if (fromCollision !== false) {
      const flash = $('flash');
      flash.classList.remove('fire');
      void flash.offsetWidth;
      flash.classList.add('fire');
      // Let the agent scene replay the fragments streaming out and converging
      // into chunk cubes, timed to land just as the slide finishes.
      setTimeout(() => toAgent({ type: 'dqm:enter-from-collision' }), 420);
    }
    shell.classList.add('at-agent');
    // Release the accelerator's locked mission camera so returning is clean.
    toAccel({ type: 'dqm:exit-mission' });
  }

  function goToAccel() {
    stopCountdown();
    shell.classList.remove('at-agent');
    if (phase === 'collided') setPhase('intro');
  }

  // ----------------------------------------------------------------- wiring
  btnMain.onclick = () => {
    if (phase === 'intro') toAccel({ type: 'dqm:launch-particle' });
    else if (phase === 'flight') toAccel({ type: 'dqm:skip-to-collision' });
    else goToAgent();
  };
  btnStay.onclick = () => { stopCountdown(); btnStay.style.display = 'none'; btnMainLabel.textContent = 'Follow the tracks into the data'; };
  // Jump straight to the pipeline without sitting through the beam flight.
  // Lands on the Chunks stage with the models already assembled.
  $('btnSkipAll').onclick = () => { goToAgent(false); toAgent({ type: 'dqm:go-stage', stage: 1 }); };
  $('btnBack').onclick = goToAccel;

  window.addEventListener('message', (e) => {
    const d = (e && e.data) || {};
    if (d.type === 'dqm:agent-ready') {
      agentReady = true;
      $('booting').classList.add('hidden');
      while (agentQueue.length) toAgent(agentQueue.shift());
    } else if (d.type === 'dqm:mission') {
      if (d.active) setPhase('flight');
      else if (phase === 'flight') setPhase('intro');
    } else if (d.type === 'dqm:collision') {
      setPhase('collided');
    }
  });

  setPhase('intro');
</script>
</body>
</html>
